<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('azrm-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Not a plain stylesheet link: that would hold up the first paint until Google answers. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=DotGothic16&family=Jersey+20&display=swap"
      onload="this.rel='stylesheet'"
    />
    <style>
      html, body {
        min-height: 100%;
      }
      body {
        margin: 0;
      }
      :root {
        --boot-bg: #e7ebef;
        --boot-grid: rgba(16, 24, 32, 0.08);
        --boot-card: #ffffff;
        --boot-card-line: #cbd4dd;
        --boot-card-shadow: 0 18px 40px -18px rgba(15, 24, 32, 0.35);
        --boot-text: #0f1820;
        --boot-muted: #526272;
        --boot-kicker: #06756f;
        --boot-lamp: #e6eef0;
        --boot-lamp-line: #c3d2d6;
        --boot-lamp-off: #a9b6c2;
        --boot-lit: #9a5700;
        --boot-lit-bg: #fff1d6;
        --boot-glow: transparent;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --boot-bg: #0a0e12;
          --boot-grid: rgba(220, 235, 250, 0.05);
          --boot-card: #0a0f14;
          --boot-card-line: #1d2935;
          --boot-card-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.6);
          --boot-text: #d3dee8;
          --boot-muted: #9fb3c6;
          --boot-kicker: #3fd9d0;
          --boot-lamp: #04070a;
          --boot-lamp-line: #1d2935;
          --boot-lamp-off: #4d6073;
          --boot-lit: #ffb52e;
          --boot-lit-bg: #04070a;
          --boot-glow: rgba(255, 181, 46, 0.7);
        }
      }
      html[data-theme='dark'] {
        --boot-bg: #0a0e12;
        --boot-grid: rgba(220, 235, 250, 0.05);
        --boot-card: #0a0f14;
        --boot-card-line: #1d2935;
        --boot-card-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.6);
        --boot-text: #d3dee8;
        --boot-muted: #9fb3c6;
        --boot-kicker: #3fd9d0;
        --boot-lamp: #04070a;
        --boot-lamp-line: #1d2935;
        --boot-lamp-off: #4d6073;
        --boot-lit: #ffb52e;
        --boot-lit-bg: #04070a;
        --boot-glow: rgba(255, 181, 46, 0.7);
      }
      #azrm-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background-color: var(--boot-bg);
        background-image: radial-gradient(var(--boot-grid) 1px, transparent 1.3px);
        background-size: 16px 16px;
        transition: opacity 180ms ease, visibility 180ms ease;
      }
      #azrm-boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .azrm-boot-card {
        width: min(340px, calc(100vw - 48px));
        box-sizing: border-box;
        padding: 18px 18px 16px;
        border-radius: 14px;
        background: var(--boot-card);
        box-shadow: inset 0 0 0 1px var(--boot-card-line), var(--boot-card-shadow);
        color: var(--boot-text);
        font: 500 0.9rem/1.35 'Chakra Petch', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      }
      .azrm-boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .azrm-boot-logo {
        display: block;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }
      .azrm-boot-title {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .azrm-boot-kicker {
        color: var(--boot-kicker);
        font: 400 0.68rem/1.2 'DotGothic16', ui-monospace, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .azrm-boot-winds {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .azrm-boot-wind {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--boot-lamp);
        box-shadow: inset 0 0 0 1px var(--boot-lamp-line);
        color: var(--boot-lamp-off);
        font: 400 1rem/1 'DotGothic16', ui-monospace, Consolas, monospace;
        animation: azrm-boot-lamp 1.6s steps(1, end) infinite;
      }
      .azrm-boot-wind:nth-child(2) { animation-delay: 0.4s; }
      .azrm-boot-wind:nth-child(3) { animation-delay: 0.8s; }
      .azrm-boot-wind:nth-child(4) { animation-delay: 1.2s; }
      .azrm-boot-subtitle {
        margin-top: 12px;
        color: var(--boot-muted);
        font-size: 14px;
      }
      @keyframes azrm-boot-lamp {
        0% { color: var(--boot-lit); background: var(--boot-lit-bg); text-shadow: 0 0 8px var(--boot-glow); }
        25% { color: var(--boot-lamp-off); background: var(--boot-lamp); text-shadow: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .azrm-boot-wind { animation: none; }
        .azrm-boot-wind:first-child { color: var(--boot-lit); background: var(--boot-lit-bg); }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <noscript>
      <style>#azrm-boot-splash { display: none !important; }</style>
    </noscript>
    <div id="azrm-boot-splash" role="status" aria-live="polite" aria-label="Loading AZRM Scoreboard">
      <div class="azrm-boot-card">
        <div class="azrm-boot-brand">
          <img class="azrm-boot-logo" src="/azrm-logo.png" alt="" width="44" height="44" />
          <div>
            <div class="azrm-boot-kicker">AZ Riichi Mahjong</div>
            <div class="azrm-boot-title">Scoreboard</div>
          </div>
        </div>
        <div class="azrm-boot-winds" aria-hidden="true" lang="ja">
          <span class="azrm-boot-wind">東</span>
          <span class="azrm-boot-wind">南</span>
          <span class="azrm-boot-wind">西</span>
          <span class="azrm-boot-wind">北</span>
        </div>
        <div class="azrm-boot-subtitle">Loading standings and match data…</div>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
